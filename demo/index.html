<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trackbar Kiosk V3 - Overlay redesign</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="tokens.css">
<style>
  :root {
    --tb-accent: var(--tb-green);
    --tb-accent-glow: rgba(151,215,0,0.55);
  }
  html, body {
    margin: 0; padding: 0;
    background: #000;
    color: #fff;
    font-family: 'Manrope', system-ui, sans-serif;
    overflow: hidden;
  }
  /* Stage: scale the fixed 1920×1080 design to fit the viewport - or, in
     device-frame mode (customer pages), into the screen cutout of the
     physical-display mockup (assets/device-frame.webp). */
  #stage-wrap {
    position: relative; width: 100vw; height: 100vh;
    background: #000; overflow: hidden;
  }
  #device { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #device-frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 1; pointer-events: none; display: none; user-select: none;
  }
  #screen { position: absolute; overflow: hidden; z-index: 2; }
  #stage {
    width: 1920px; height: 1080px;
    transform-origin: top left; position: absolute; left: 0; top: 0;
  }
  /* Boot loader - covers everything until the in-browser app has mounted, so
     the device frame never shows around an empty screen. Removed on first render. */
  #boot-loader {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #000; transition: opacity .35s ease;
  }
  #boot-loader .ring {
    width: 60px; height: 60px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,0.14); border-top-color: #97D700;
    animation: v3-spin .9s linear infinite;
  }
  @keyframes v3-spin { to { transform: rotate(360deg); } }
  /* Hide scrollbars in our stage */
  #stage::-webkit-scrollbar { display: none; }
  button { font-family: inherit; }
  @keyframes v3-pulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.3); }
  }
  @keyframes v3-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div id="stage-wrap">
    <div id="boot-loader" aria-hidden="true"><div class="ring"></div></div>
    <div id="device">
      <img id="device-frame" src="assets/device-frame.webp" alt="">
      <div id="screen">
        <div id="stage">
          <div id="root"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Remove the boot loader once the React app has rendered into #root (so the
    // device frame never shows around an empty screen during in-browser compile).
    (function () {
      var bl = document.getElementById('boot-loader'), root = document.getElementById('root');
      if (!bl || !root) return;
      function done() { if (!bl) return; bl.style.opacity = '0'; setTimeout(function () { if (bl && bl.parentNode) bl.parentNode.removeChild(bl); bl = null; }, 450); }
      var obs = new MutationObserver(function () { if (root.firstElementChild) { obs.disconnect(); done(); } });
      obs.observe(root, { childList: true });
      setTimeout(done, 12000); // safety net
    })();
  </script>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <script>
    // Scale the 1920×1080 stage to fit the viewport - or, in device-frame
    // mode, into the screen cutout of the display mockup. Frame is ON for
    // customer (/g/<token>/) pages by default; ?frame=0 disables, ?frame=1 forces.
    (function () {
      const wrap = document.getElementById('stage-wrap');
      const device = document.getElementById('device');
      const frame = document.getElementById('device-frame');
      const screen = document.getElementById('screen');
      const stage = document.getElementById('stage');
      const params = new URLSearchParams(location.search);
      // Customer-facing pages - per-gym links (/g/<token>/) and the public
      // website demo (/demo/) - show the physical-display mockup by default.
      const isCustomer = /^\/(g|demo)\//.test(location.pathname);
      const FRAME = params.get('frame') === '1' || (isCustomer && params.get('frame') !== '0');
      const PNG_AR = 2770 / 1818;
      const CUT = { x: 0.0787, y: 0.0715, w: 0.8325, h: 0.7288 }; // screen cutout in the PNG
      function place(sl, st, sw, sh, cover) {
        screen.style.left = sl + 'px'; screen.style.top = st + 'px';
        screen.style.width = sw + 'px'; screen.style.height = sh + 'px';
        const s = (cover ? Math.max : Math.min)(sw / 1920, sh / 1080);
        stage.style.transform = `translate(${(sw - 1920 * s) / 2}px, ${(sh - 1080 * s) / 2}px) scale(${s})`;
        document.documentElement.style.setProperty('--dc-inv-zoom', String(1 / s));
      }
      function fit() {
        const vw = wrap.clientWidth, vh = wrap.clientHeight;
        if (FRAME) {
          const dvW = Math.min(vw, vh * PNG_AR), dvH = dvW / PNG_AR;
          device.style.width = dvW + 'px'; device.style.height = dvH + 'px';
          frame.style.display = 'block';
          place(dvW * CUT.x, dvH * CUT.y, dvW * CUT.w, dvH * CUT.h, true);
        } else {
          device.style.width = vw + 'px'; device.style.height = vh + 'px';
          frame.style.display = 'none';
          place(0, 0, vw, vh, false);
        }
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
  <script src="app.min.js" defer></script>
</body>
</html>
